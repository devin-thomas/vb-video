<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <style>
      .bg { fill: #0D1117; }
      .title { fill: #8B949E; font-family: Consolas, 'Courier New', monospace; font-size: 22px; letter-spacing: 2px; }
      .code { font-family: Consolas, 'Courier New', monospace; font-size: 17px; }
      .prep { fill: #C586C0; }
      .kw { fill: #569CD6; }
      .str { fill: #CE9178; }
      .api { fill: #D4D4D4; }
      .fn { fill: #DCDCAA; }
      .cmt { fill: #6A9955; }
      .p { fill: #D4D4D4; }
      .macro { fill: #C586C0; font-weight: bold; }
      .ty { fill: #4EC9B0; }
    </style>
  </defs>
  <rect class="bg" width="1920" height="1080"/>

  <!-- Title -->
  <text class="title" x="960" y="50" text-anchor="middle" opacity="0.65">MFC MESSAGE MAPS</text>
  <line x1="160" y1="68" x2="1760" y2="68" stroke="#30363D" stroke-width="1"/>

  <!-- Subtitle -->
  <text x="960" y="100" text-anchor="middle" fill="#8B949E" font-family="Consolas, 'Courier New', monospace" font-size="14px" opacity="0.5">What happens when you let preprocessor macros design your event system</text>

  <g class="code">

    <!-- Class declaration -->
    <text x="200" y="160"><tspan class="cmt">// CMyDialog.h — Class declaration</tspan></text>

    <text x="200" y="192"><tspan class="kw">class</tspan><tspan class="p"> </tspan><tspan class="ty">CMyDialog</tspan><tspan class="p"> : </tspan><tspan class="kw">public</tspan><tspan class="p"> </tspan><tspan class="ty">CDialog</tspan></text>
    <text x="200" y="224"><tspan class="p">{</tspan></text>

    <text x="200" y="256"><tspan class="kw">public</tspan><tspan class="p">:</tspan></text>
    <text x="248" y="288"><tspan class="ty">CMyDialog</tspan><tspan class="p">(</tspan><tspan class="ty">CWnd</tspan><tspan class="p">* pParent = </tspan><tspan class="api">NULL</tspan><tspan class="p">);</tspan></text>
    <text x="248" y="320"><tspan class="kw">enum</tspan><tspan class="p"> { </tspan><tspan class="api">IDD</tspan><tspan class="p"> = </tspan><tspan class="api">IDD_MY_DIALOG</tspan><tspan class="p"> };</tspan></text>

    <text x="200" y="368"><tspan class="kw">protected</tspan><tspan class="p">:</tspan></text>
    <text x="248" y="400"><tspan class="kw">virtual</tspan><tspan class="p"> </tspan><tspan class="kw">void</tspan><tspan class="p"> </tspan><tspan class="fn">DoDataExchange</tspan><tspan class="p">(</tspan><tspan class="ty">CDataExchange</tspan><tspan class="p">* pDX);</tspan></text>
    <text x="248" y="432"><tspan class="kw">afx_msg</tspan><tspan class="p"> </tspan><tspan class="kw">void</tspan><tspan class="p"> </tspan><tspan class="fn">OnPaint</tspan><tspan class="p">();</tspan></text>
    <text x="248" y="464"><tspan class="kw">afx_msg</tspan><tspan class="p"> </tspan><tspan class="kw">void</tspan><tspan class="p"> </tspan><tspan class="fn">OnBnClickedOk</tspan><tspan class="p">();</tspan></text>
    <text x="248" y="496"><tspan class="kw">afx_msg</tspan><tspan class="p"> </tspan><tspan class="kw">void</tspan><tspan class="p"> </tspan><tspan class="fn">OnBnClickedCancel</tspan><tspan class="p">();</tspan></text>
    <text x="248" y="528"><tspan class="kw">afx_msg</tspan><tspan class="p"> </tspan><tspan class="kw">void</tspan><tspan class="p"> </tspan><tspan class="fn">OnTimer</tspan><tspan class="p">(</tspan><tspan class="ty">UINT_PTR</tspan><tspan class="p"> nIDEvent);</tspan></text>

    <text x="248" y="576"><tspan class="macro">DECLARE_MESSAGE_MAP</tspan><tspan class="p">()</tspan></text>
    <text x="200" y="608"><tspan class="p">};</tspan></text>

    <!-- Separator -->
    <line x1="200" y1="640" x2="1720" y2="640" stroke="#30363D" stroke-width="1" stroke-dasharray="4,4"/>

    <!-- Implementation -->
    <text x="200" y="672"><tspan class="cmt">// CMyDialog.cpp — The message map</tspan></text>

    <text x="200" y="720"><tspan class="macro">BEGIN_MESSAGE_MAP</tspan><tspan class="p">(</tspan><tspan class="ty">CMyDialog</tspan><tspan class="p">, </tspan><tspan class="ty">CDialog</tspan><tspan class="p">)</tspan></text>
    <text x="248" y="752"><tspan class="macro">ON_WM_PAINT</tspan><tspan class="p">()</tspan></text>
    <text x="248" y="784"><tspan class="macro">ON_WM_TIMER</tspan><tspan class="p">()</tspan></text>
    <text x="248" y="816"><tspan class="macro">ON_BN_CLICKED</tspan><tspan class="p">(</tspan><tspan class="api">IDOK</tspan><tspan class="p">, &amp;</tspan><tspan class="ty">CMyDialog</tspan><tspan class="p">::</tspan><tspan class="fn">OnBnClickedOk</tspan><tspan class="p">)</tspan></text>
    <text x="248" y="848"><tspan class="macro">ON_BN_CLICKED</tspan><tspan class="p">(</tspan><tspan class="api">IDCANCEL</tspan><tspan class="p">, &amp;</tspan><tspan class="ty">CMyDialog</tspan><tspan class="p">::</tspan><tspan class="fn">OnBnClickedCancel</tspan><tspan class="p">)</tspan></text>
    <text x="248" y="880"><tspan class="macro">ON_COMMAND</tspan><tspan class="p">(</tspan><tspan class="api">ID_FILE_SAVE</tspan><tspan class="p">, &amp;</tspan><tspan class="ty">CMyDialog</tspan><tspan class="p">::</tspan><tspan class="fn">OnFileSave</tspan><tspan class="p">)</tspan></text>
    <text x="200" y="912"><tspan class="macro">END_MESSAGE_MAP</tspan><tspan class="p">()</tspan></text>

  </g>

  <!-- Footer annotation -->
  <text x="960" y="980" text-anchor="middle" fill="#484F58" font-family="Consolas, 'Courier New', monospace" font-size="14px">These macros expand to a static lookup table. Good luck debugging that in 1995.</text>

  <!-- Asset ID -->
  <text x="1880" y="1060" text-anchor="end" fill="#30363D" font-family="Consolas, 'Courier New', monospace" font-size="11px">REF-02</text>
</svg>

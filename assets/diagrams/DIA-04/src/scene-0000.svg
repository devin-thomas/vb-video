<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img"><title>Integer example: ByRef / ByVal</title><defs><pattern id="back" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M0 6L6 0L12 6L6 12Z" fill="none" stroke="#8fa1c5" stroke-width="1"/></pattern><pattern id="felt" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M1 2h1M6 7h1" stroke="#ffffff" stroke-opacity=".035"/></pattern></defs><rect x="0.00" y="0.00" width="1920.00" height="1080.00" rx="0" fill="#111318"/><text x="120.00" y="138.00" font-family="Liberation Sans" font-size="58" font-weight="700" fill="#f1f3f5" text-anchor="start" opacity="1" xml:space="preserve">ByRef versus ByVal</text><text x="120.00" y="196.00" font-family="Liberation Sans" font-size="28" font-weight="400" fill="#aeb6bf" text-anchor="start" opacity="1" xml:space="preserve">Integer example</text><rect x="120.00" y="274.00" width="810.00" height="599.00" rx="0" fill="#1b2027"/><text x="164.00" y="359.00" font-family="DejaVu Sans Mono" font-size="64" font-weight="700" fill="#79adff" text-anchor="start" opacity="1" xml:space="preserve">ByRef</text><text x="178.00" y="470.00" font-family="Liberation Sans" font-size="31" font-weight="400" fill="#aeb6bf" text-anchor="start" opacity="1" xml:space="preserve">Caller</text><text x="587.00" y="470.00" font-family="Liberation Sans" font-size="31" font-weight="400" fill="#aeb6bf" text-anchor="start" opacity="1" xml:space="preserve">Parameter</text><rect x="163.00" y="509.00" width="275.00" height="144.00" rx="0" fill="#111820" stroke="#79adff" stroke-width="2"/><rect x="574.00" y="509.00" width="310.00" height="144.00" rx="0" fill="#111820" stroke="#79adff" stroke-width="2"/><text x="300.00" y="602.00" font-family="DejaVu Sans Mono" font-size="51" font-weight="700" fill="#f1f3f5" text-anchor="middle" opacity="1" xml:space="preserve">x = 7</text><text x="729.00" y="602.00" font-family="DejaVu Sans Mono" font-size="51" font-weight="700" fill="#f1f3f5" text-anchor="middle" opacity="1" xml:space="preserve">p = 7</text><path d="M564.00 581.00L455.00 581.00" fill="none" stroke="#79adff" stroke-width="4"/><path d="M467.60625943293746 574.9104825224427 L455 581 L467.60625943293746 587.0895174775573" stroke="#79adff" stroke-width="4" fill="none" stroke-linejoin="round"/><text x="525.00" y="744.00" font-family="Liberation Sans" font-size="35" font-weight="400" fill="#f1f3f5" text-anchor="middle" opacity="1" xml:space="preserve">Same variable</text><text x="525.00" y="818.00" font-family="Liberation Sans" font-size="34" font-weight="400" fill="#aeb6bf" text-anchor="middle" opacity="1" xml:space="preserve">Caller changes to 9</text><rect x="990.00" y="274.00" width="810.00" height="599.00" rx="0" fill="#1b2027"/><text x="1034.00" y="359.00" font-family="DejaVu Sans Mono" font-size="64" font-weight="700" fill="#79adff" text-anchor="start" opacity="1" xml:space="preserve">ByVal</text><text x="1048.00" y="470.00" font-family="Liberation Sans" font-size="31" font-weight="400" fill="#aeb6bf" text-anchor="start" opacity="1" xml:space="preserve">Caller</text><text x="1457.00" y="470.00" font-family="Liberation Sans" font-size="31" font-weight="400" fill="#aeb6bf" text-anchor="start" opacity="1" xml:space="preserve">Parameter</text><rect x="1033.00" y="509.00" width="275.00" height="144.00" rx="0" fill="#111820" stroke="#79adff" stroke-width="2"/><rect x="1444.00" y="509.00" width="310.00" height="144.00" rx="0" fill="#111820" stroke="#79adff" stroke-width="2"/><text x="1170.00" y="602.00" font-family="DejaVu Sans Mono" font-size="51" font-weight="700" fill="#f1f3f5" text-anchor="middle" opacity="1" xml:space="preserve">x = 7</text><text x="1599.00" y="602.00" font-family="DejaVu Sans Mono" font-size="51" font-weight="700" fill="#f1f3f5" text-anchor="middle" opacity="1" xml:space="preserve">p = 7</text><path d="M1319.00 581.00L1426.00 581.00" fill="none" stroke="#eab676" stroke-width="4"/><path d="M1413.3937405670624 587.0895174775573 L1426 581 L1413.3937405670624 574.9104825224427" stroke="#eab676" stroke-width="4" fill="none" stroke-linejoin="round"/><text x="1395.00" y="744.00" font-family="Liberation Sans" font-size="35" font-weight="400" fill="#f1f3f5" text-anchor="middle" opacity="1" xml:space="preserve">Value copied into p</text><text x="1395.00" y="818.00" font-family="Liberation Sans" font-size="34" font-weight="400" fill="#aeb6bf" text-anchor="middle" opacity="1" xml:space="preserve">Caller stays 7</text></svg>
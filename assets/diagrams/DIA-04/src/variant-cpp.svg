<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img"><title>C++: bump(x) with int n and int&amp; n</title><defs><pattern id="back" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M0 6L6 0L12 6L6 12Z" fill="none" stroke="#8fa1c5" stroke-width="1"/></pattern><pattern id="felt" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M1 2h1M6 7h1" stroke="#ffffff" stroke-opacity=".035"/></pattern></defs><rect x="0.00" y="0.00" width="1920.00" height="1080.00" rx="0" fill="#111318"/><text x="120.00" y="138.00" font-family="Liberation Sans" font-size="58" font-weight="700" fill="#f1f3f5" text-anchor="start" opacity="1" xml:space="preserve">C++: int n versus int&amp; n</text><text x="120.00" y="196.00" font-family="Liberation Sans" font-size="28" font-weight="400" fill="#aeb6bf" text-anchor="start" opacity="1" xml:space="preserve">Authored teaching example with one Integer. It shows nothing about what ByVal does with an array.</text><rect x="120.00" y="240.00" width="816.00" height="740.00" rx="0" fill="#1b2027"/><text x="156.00" y="312.00" font-family="DejaVu Sans Mono" font-size="50" font-weight="700" fill="#79adff" text-anchor="start" opacity="1" xml:space="preserve">int n</text><text x="156.00" y="358.00" font-family="Liberation Sans" font-size="28" font-weight="400" fill="#aeb6bf" text-anchor="start" opacity="1" xml:space="preserve">by value: the function gets a copy</text><text x="170.00" y="428.00" font-family="DejaVu Sans Mono" font-size="32" font-weight="400" fill="#79adff" text-anchor="start" opacity="1" xml:space="preserve">void</text><text x="246.00" y="428.00" font-family="DejaVu Sans Mono" font-size="32" font-weight="400" fill="#f1f3f5" text-anchor="start" opacity="1" xml:space="preserve"> </text><text x="265.00" y="428.00" font-family="DejaVu Sans Mono" font-size="32" font-weight="400" fill="#f1f3f5" text-anchor="start" opacity="1" xml:space="preserve">bump</text><text x="341.00" y="428.00"
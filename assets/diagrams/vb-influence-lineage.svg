<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <!-- Arrowhead marker -->
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <polygon points="0 0, 10 3.5, 0 7" fill="#8B949E"/>
    </marker>
    <marker id="arrow-teal" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2DD4BF"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <polygon points="0 0, 10 3.5, 0 7" fill="#A78BFA"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34D399"/>
    </marker>

    <!-- Glow filters -->
    <filter id="glow-root" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-teal" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Subtle grid pattern for background -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#161B22" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="#0D1117"/>
  <rect width="1920" height="1080" fill="url(#grid)" opacity="0.6"/>

  <!-- Title -->
  <text x="960" y="72" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="42" font-weight="700" fill="#E6EDF3" letter-spacing="1">The DNA Visual Basic Left Behind</text>
  <text x="960" y="108" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="18" fill="#8B949E" letter-spacing="2">HOW THE COMPONENT-BASED UI PARADIGM EVOLVED</text>

  <!-- Era labels along the bottom -->
  <text x="240" y="1010" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#2DD4BF" opacity="0.5" letter-spacing="3">EARLY 1990s</text>
  <text x="620" y="1010" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#2DD4BF" opacity="0.5" letter-spacing="3">MID 1990s</text>
  <text x="1040" y="1010" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#A78BFA" opacity="0.5" letter-spacing="3">2000s</text>
  <text x="1560" y="1010" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#34D399" opacity="0.5" letter-spacing="3">2010s &ndash; PRESENT</text>

  <!-- Faint vertical era dividers -->
  <line x1="430" y1="130" x2="430" y2="980" stroke="#21262D" stroke-width="1" stroke-dasharray="6,8"/>
  <line x1="830" y1="130" x2="830" y2="980" stroke="#21262D" stroke-width="1" stroke-dasharray="6,8"/>
  <line x1="1260" y1="130" x2="1260" y2="980" stroke="#21262D" stroke-width="1" stroke-dasharray="6,8"/>

  <!-- ============================================ -->
  <!--  NODES                                        -->
  <!-- ============================================ -->

  <!-- Visual Basic (1991) — ROOT NODE -->
  <g filter="url(#glow-root)">
    <rect x="80" y="380" width="320" height="140" rx="16" ry="16" fill="#0F2830" stroke="#2DD4BF" stroke-width="3"/>
    <rect x="80" y="380" width="320" height="140" rx="16" ry="16" fill="none" stroke="#2DD4BF" stroke-width="1" opacity="0.3" stroke-dasharray="0" style="filter:url(#glow-teal)"/>
  </g>
  <!-- VB icon area -->
  <rect x="100" y="400" width="56" height="56" rx="8" fill="#2DD4BF" opacity="0.15"/>
  <text x="128" y="438" text-anchor="middle" font-family="'Consolas', 'Courier New', monospace" font-size="28" font-weight="700" fill="#2DD4BF">VB</text>
  <text x="172" y="418" font-family="'Segoe UI', Arial, sans-serif" font-size="24" font-weight="700" fill="#E6EDF3">Visual Basic</text>
  <text x="172" y="448" font-family="'Segoe UI', Arial, sans-serif" font-size="16" fill="#2DD4BF">1991</text>
  <!-- Tags under the node -->
  <rect x="100" y="470" width="120" height="24" rx="4" fill="#2DD4BF" opacity="0.12"/>
  <text x="160" y="487" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#2DD4BF">RAD Pioneer</text>
  <rect x="228" y="470" width="150" height="24" rx="4" fill="#2DD4BF" opacity="0.12"/>
  <text x="303" y="487" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#2DD4BF">Form Designer + Events</text>

  <!-- VBA / Office Macros (1993) -->
  <g>
    <rect x="500" y="210" width="260" height="120" rx="14" ry="14" fill="#0F2830" stroke="#2DD4BF" stroke-width="2"/>
  </g>
  <text x="630" y="255" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="22" font-weight="700" fill="#E6EDF3">VBA / Office</text>
  <text x="630" y="280" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="22" font-weight="700" fill="#E6EDF3">Macros</text>
  <text x="630" y="310" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="15" fill="#2DD4BF">1993</text>
  <rect x="560" y="318" width="140" height="20" rx="4" fill="#2DD4BF" opacity="0.1"/>
  <text x="630" y="333" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#8B949E" font-style="italic">Still in Excel today</text>

  <!-- Borland Delphi (1995) -->
  <g>
    <rect x="500" y="560" width="260" height="120" rx="14" ry="14" fill="#0F2830" stroke="#2DD4BF" stroke-width="2"/>
  </g>
  <text x="630" y="610" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="22" font-weight="700" fill="#E6EDF3">Borland Delphi</text>
  <text x="630" y="660" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="15" fill="#2DD4BF">1995</text>

  <!-- .NET WinForms (2002) -->
  <g>
    <rect x="870" y="380" width="300" height="140" rx="14" ry="14" fill="#1A1333" stroke="#A78BFA" stroke-width="2"/>
  </g>
  <text x="1020" y="430" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="22" font-weight="700" fill="#E6EDF3">.NET WinForms</text>
  <text x="1020" y="460" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="15" fill="#A78BFA">2002</text>
  <rect x="920" y="478" width="200" height="24" rx="4" fill="#A78BFA" opacity="0.1"/>
  <text x="1020" y="495" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#A78BFA">VB's spiritual successor</text>

  <!-- WPF / XAML (2006) -->
  <g>
    <rect x="870" y="610" width="300" height="120" rx="14" ry="14" fill="#1A1333" stroke="#A78BFA" stroke-width="2"/>
  </g>
  <text x="1020" y="660" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="22" font-weight="700" fill="#E6EDF3">WPF / XAML</text>
  <text x="1020" y="690" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="15" fill="#A78BFA">2006</text>

  <!-- React (2013) -->
  <g>
    <rect x="1360" y="200" width="240" height="110" rx="14" ry="14" fill="#0B1F17" stroke="#34D399" stroke-width="2"/>
  </g>
  <text x="1480" y="248" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="22" font-weight="700" fill="#E6EDF3">React</text>
  <text x="1480" y="278" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="15" fill="#34D399">2013</text>
  <text x="1480" y="298" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#8B949E">Facebook / Meta</text>

  <!-- SwiftUI (2019) -->
  <g>
    <rect x="1360" y="420" width="240" height="110" rx="14" ry="14" fill="#0B1F17" stroke="#34D399" stroke-width="2"/>
  </g>
  <text x="1480" y="468" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="22" font-weight="700" fill="#E6EDF3">SwiftUI</text>
  <text x="1480" y="498" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="15" fill="#34D399">2019</text>
  <text x="1480" y="518" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#8B949E">Apple</text>

  <!-- Flutter (2018) -->
  <g>
    <rect x="1360" y="640" width="240" height="110" rx="14" ry="14" fill="#0B1F17" stroke="#34D399" stroke-width="2"/>
  </g>
  <text x="1480" y="688" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="22" font-weight="700" fill="#E6EDF3">Flutter</text>
  <text x="1480" y="718" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="15" fill="#34D399">2018</text>
  <text x="1480" y="738" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#8B949E">Google</text>

  <!-- ============================================ -->
  <!--  CONNECTING ARROWS + EDGE LABELS              -->
  <!-- ============================================ -->

  <!-- VB -> VBA (upward-right curve) -->
  <path d="M 400,420 C 440,420 460,300 500,270" fill="none" stroke="#2DD4BF" stroke-width="2" marker-end="url(#arrow-teal)" opacity="0.7"/>
  <g transform="translate(430, 335) rotate(-50)">
    <rect x="-55" y="-12" width="110" height="20" rx="3" fill="#0D1117" opacity="0.85"/>
    <text x="0" y="3" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#2DD4BF" font-weight="600">event-driven</text>
  </g>

  <!-- VB -> Delphi (downward-right curve) -->
  <path d="M 400,490 C 440,490 460,580 500,610" fill="none" stroke="#2DD4BF" stroke-width="2" marker-end="url(#arrow-teal)" opacity="0.7"/>
  <g transform="translate(432, 560) rotate(42)">
    <rect x="-80" y="-12" width="160" height="20" rx="3" fill="#0D1117" opacity="0.85"/>
    <text x="0" y="3" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#2DD4BF" font-weight="600">visual form designer</text>
  </g>

  <!-- VB -> WinForms (straight right) -->
  <path d="M 400,450 C 550,450 700,450 870,450" fill="none" stroke="#8B949E" stroke-width="2.5" marker-end="url(#arrow)" opacity="0.5" stroke-dasharray="8,4"/>
  <g transform="translate(635, 440)">
    <rect x="-62" y="-12" width="124" height="20" rx="3" fill="#0D1117" opacity="0.9"/>
    <text x="0" y="3" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#E6EDF3" font-weight="600">direct lineage</text>
  </g>

  <!-- Delphi -> WinForms (upward-right) -->
  <path d="M 760,610 C 800,580 840,520 870,490" fill="none" stroke="#A78BFA" stroke-width="1.5" marker-end="url(#arrow-purple)" opacity="0.5"/>
  <g transform="translate(820, 545) rotate(-42)">
    <rect x="-60" y="-12" width="120" height="20" rx="3" fill="#0D1117" opacity="0.85"/>
    <text x="0" y="3" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#A78BFA" font-weight="600">drag-and-drop UI</text>
  </g>

  <!-- WinForms -> WPF (downward) -->
  <path d="M 1020,520 C 1020,560 1020,580 1020,610" fill="none" stroke="#A78BFA" stroke-width="2" marker-end="url(#arrow-purple)" opacity="0.6"/>
  <g transform="translate(1020, 568)">
    <rect x="-62" y="-12" width="124" height="20" rx="3" fill="#0D1117" opacity="0.85"/>
    <text x="0" y="3" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#A78BFA" font-weight="600">component model</text>
  </g>

  <!-- WinForms -> React (up-right) -->
  <path d="M 1170,420 C 1240,380 1300,310 1360,270" fill="none" stroke="#34D399" stroke-width="1.5" marker-end="url(#arrow-green)" opacity="0.5"/>
  <g transform="translate(1268, 340) rotate(-30)">
    <rect x="-88" y="-12" width="176" height="20" rx="3" fill="#0D1117" opacity="0.85"/>
    <text x="0" y="3" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#34D399" font-weight="600">declarative components</text>
  </g>

  <!-- WPF -> SwiftUI (right) -->
  <path d="M 1170,670 C 1240,660 1300,540 1360,490" fill="none" stroke="#34D399" stroke-width="1.5" marker-end="url(#arrow-green)" opacity="0.5"/>
  <g transform="translate(1268, 590) rotate(-35)">
    <rect x="-62" y="-12" width="124" height="20" rx="3" fill="#0D1117" opacity="0.85"/>
    <text x="0" y="3" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#34D399" font-weight="600">declarative UI</text>
  </g>

  <!-- WPF -> Flutter (right-down) -->
  <path d="M 1170,690 C 1240,700 1300,700 1360,700" fill="none" stroke="#34D399" stroke-width="1.5" marker-end="url(#arrow-green)" opacity="0.5"/>
  <g transform="translate(1265, 690)">
    <rect x="-55" y="-12" width="110" height="20" rx="3" fill="#0D1117" opacity="0.85"/>
    <text x="0" y="3" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#34D399" font-weight="600">widget tree</text>
  </g>

  <!-- ============================================ -->
  <!--  CONNECTING THEME — bottom banner              -->
  <!-- ============================================ -->
  <rect x="160" y="880" width="1600" height="70" rx="12" fill="#161B22" stroke="#30363D" stroke-width="1"/>
  <line x1="180" y1="880" x2="180" y2="950" stroke="#2DD4BF" stroke-width="3" opacity="0.6"/>
  <text x="210" y="910" font-family="'Segoe UI', Arial, sans-serif" font-size="16" fill="#E6EDF3" font-weight="600">Connecting Thread</text>
  <text x="210" y="935" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#8B949E">The idea of building UI by composing visual components persisted through every generation &#8212; from VB&#8217;s toolbox to React&#8217;s JSX.</text>

  <!-- ============================================ -->
  <!--  LEGEND                                       -->
  <!-- ============================================ -->
  <g transform="translate(1620, 870)">
    <rect x="0" y="0" width="230" height="90" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1"/>
    <circle cx="20" cy="22" r="6" fill="#2DD4BF"/>
    <text x="36" y="27" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#8B949E">1990s Era</text>
    <circle cx="20" cy="47" r="6" fill="#A78BFA"/>
    <text x="36" y="52" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#8B949E">2000s Era</text>
    <circle cx="20" cy="72" r="6" fill="#34D399"/>
    <text x="36" y="77" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#8B949E">Modern Era</text>
  </g>

  <!-- Subtle "DNA strand" decorative element behind the title -->
  <g opacity="0.06">
    <path d="M 200,50 Q 480,20 760,50 T 1320,50 T 1720,50" fill="none" stroke="#2DD4BF" stroke-width="40"/>
    <path d="M 200,70 Q 480,100 760,70 T 1320,70 T 1720,70" fill="none" stroke="#A78BFA" stroke-width="40"/>
  </g>
</svg>
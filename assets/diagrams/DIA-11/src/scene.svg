<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img"><title>1995 development tools</title><defs><pattern id="back" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M0 6L6 0L12 6L6 12Z" fill="none" stroke="#8fa1c5" stroke-width="1"/></pattern><pattern id="felt" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M1 2h1M6 7h1" stroke="#ffffff" stroke-opacity=".035"/></pattern></defs><rect x="0.00" y="0.00" width="1920.00" height="1080.00" rx="0" fill="#111318"/><text x="120.00" y="138.00" font-family="Liberation Sans" font-size="58" font-weight="700" fill="#f1f3f5" text-anchor="start" opacity="1" xml:space="preserve">1995 development tools</text><text x="138.00" y="268.00" font-family="Liberation Sans" font-size="28" font-weight="700" fill="#aeb6bf" text-anchor="start" opacity="1" xml:space="preserve">Tool</text><text x="438.00" y="268.00" font-family="Liberation Sans" font-size="28" font-weight="700" fill="#aeb6bf" text-anchor="start" opacity="1" xml:space="preserve">Language / tooling</text><text x="748.00" y="268.00" font-family="Liberation Sans" font-size="28" font-weight="700" fill="#aeb6bf" text-anchor="start" opacity="1" xml:space="preserve">GUI approach</text><text x="1118.00" y="268.00" font-family="Liberation Sans" font-size="28" font-weight="700" fill="#aeb6bf" text-anchor="start" opacity="1" xml:space="preserve">Strength</text><text x="1468.00" y="268.00" font-family="Liberation Sans" font-size="28" font-weight="700" fill="#aeb6bf" text-anchor="start" opacity="1" xml:space="preserve">Tradeoff</text><path d="M120.00 288.00L1800.00 288.00" fill="none" stroke="#aeb6bf" stroke-width="2"/><rect x="120.00" y="288.00" width="1680.00" height="136.00" rx="0" fill="#1b2027"/><text x="138.00" y="365.60" font-family="Liberation Sans" font-size="32" font-weight="700" fill="#f1f3f5" text-anchor="start" opacity="1" xml:space="preserve">Visual Basic 4</text><text x="438.00" y="365.00" font-family="Liberation Sans" font-size="30" font-weight="400" fill="#f1f3f5" text-anchor="start" opacity="1" xml:space="preserve">BASIC</text><text x="748.00" y="347.00" font-family="Liberation Sans" font-size="30" font-weight="400" fill="#f1f3f5" text-anchor="start" opacity="1" xml:space="preserve">Drag-and-drop form</text><text x="748.00" y="383.00" font-family="Liberation Sans" font-size="30" font-weight="400" fill="#f1f3f5" text-anchor="start" opacity="1" xml:space="preserve">designer</text><text x="1118.00" y="347.00" font-family="Liberation Sans" font-size="30" font-weight="400" fill="#f1f3f5" text-anchor="start" opacity="1" xml:space="preserve">Easier than C++, more</text><text x="1118.00" y="383.00" font-family="Liberation Sans" font-size="30" font-weight="400" fill="#f1f3f5" text-anchor="start" opacity="1" xml:space="preserve">established</text><text x="1468.00" y="347.00" font-family="Liberation Sans" font-size="30" font-weight="400" fill="#f1f3f5" text-anchor="start" opacity="1" xml:space="preserve">Not the best tool for</text><text x="1468.00" y="383.00" font-family="Liberation Sans" font-size="30" font-weight="400" fill="#f1f3f5" text-anchor="start" opacity="1" xml:space="preserve">any single job</text><text x="138.00" y="482.40" font-family="Liberation Sans" font-size="32" font-weight="700" fill="#f1f3f5" text-anchor="start" opacity="1" xml:space="preserve">Visual C++ 4 /</text><text x="138.00" y="520.80" font-family="Liberation Sans" font-size="32" font-weight="700" fill="#f1f3f5" text-anchor="start" opacity="1" xml:space="preserve">MFC</text><text x="438.00" y="501.00" font-family="Liberation Sans" font-size="30" font-weight="400" fill="#f1f3f5" text-anchor="start" opacity="1" xml:space="preserve">C++</text><text x="748.00" y="501.00" font-family="Liberation Sans" font-size="30" font-weight="400" fill="#f1f3f5" text-anchor="start" opacity="1" xml:space="preserve">MFC class framework</text><text x="1118.00" y="501.00" font-family="Liberation Sans" font-size="30" font-weight="400" fill="#f1f3f5" text-anchor="start" opacity="1" xml:space="preserve">Powerful, fast</text><text x="1468.00" y="465.00" font-family="Liberation Sans" font-size="30" font-weight="400" fill="#f1f3f5" text-anchor="start" opacity="1" xml:space="preserve">Hard to learn: deep</text><text x="1468.00" y="501.00" font-family="Liberation Sans" font-size="30" font-weight="400" fill="#f1f3f5" text-anchor="start" opacity="1" xml:space="preserve">class hierarchies,</text><text x="1468.00" y="537.00" font-family="Liberation Sans" font-size="30" font-weight="400" fill="#f1f3f5" text-anchor="start" opacity="1" xml:space="preserve">macros</text><rect x="120.00" y="560.00" width="1680.00" height="136.00" rx="0" fill="#1b2027"/><text x="138.00" y="618.40" font-family="Liberation Sans" font-size="32" font-weight="700" fill="#f1f3f5" text-anchor="start" opacity="1" xml:space="preserve">Borland Delphi</text><text x="138.00" y="656.80" font-family="Liberation Sans" font-size="32" font-weight="700" fill="#f1f3f5" text-anchor="start" opacity="1" xml:space="preserve">1.0</text><text x="438.00" y="637.00" font-family="Liberation Sans" font-size="30" font-weight="400" fill="#f1f3f5" text-anchor="start" opacity="1" xml:space="preserve">Object Pascal</text><text x="748.00" y="619.00" font-family="Liberation Sans" font-size="30" font-weight="400" fill="#f1f3f5" text-anchor="start" opacity="1" xml:space="preserve">Drag-and-drop form</text><text x="748.00" y="655.00" font-family="Liberation Sans" font-size="30" font-weight="400" fill="#f1f3f5" text-anchor="start" opacity="1" xml:space="preserve">designer</text><text x="1118.00" y="619.00" font-family="Liberation Sans" font-size="30" font-weight="400" fill="#f1f3f5" text-anchor="start" opacity="1" xml:space="preserve">Native code, faster at</text><text x="1118.00" y="655.00" font-family="Liberation Sans" font-size="30" font-weight="400" fill="#f1f3f5" text-anchor="start" opacity="1" xml:space="preserve">runtime</text><text x="1468.00" y="619.00" font-family="Liberation Sans" font-size="30" font-weight="400" fill="#f1f3f5" text-anchor="start" opacity="1" xml:space="preserve">Smaller ecosystem</text><text x="1468.00" y="655.00" font-family="Liberation Sans" font-size="30" font-weight="400" fill="#f1f3f5" text-anchor="start" opacity="1" xml:space="preserve">than VB</text><text x="138.00" y="773.60" font-family="Liberation Sans" font-size="32" font-weight="700" fill="#f1f3f5" text-anchor="start" opacity="1" xml:space="preserve">PowerBuilder</text><text x="438.00" y="755.00" font-family="Liberation Sans" font-size="30" font-weight="400" fill="#f1f3f5" text-anchor="start" opacity="1" xml:space="preserve">Corporate database</text><text x="438.00" y="791.00" font-family="Liberation Sans" font-size="30" font-weight="400" fill="#f1f3f5" text-anchor="start" opacity="1" xml:space="preserve">tool</text><text x="748.00" y="755.00" font-family="Liberation Sans" font-size="30" font-weight="400" fill="#f1f3f5" text-anchor="start" opacity="1" xml:space="preserve">DataWindows for</text><text x="748.00" y="791.00" font-family="Liberation Sans" font-size="30" font-weight="400" fill="#f1f3f5" text-anchor="start" opacity="1" xml:space="preserve">data-entry forms</text><text x="1118.00" y="755.00" font-family="Liberation Sans" font-size="30" font-weight="400" fill="#f1f3f5" text-anchor="start" opacity="1" xml:space="preserve">Data-entry forms made</text><text x="1118.00" y="791.00" font-family="Liberation Sans" font-size="30" font-weight="400" fill="#f1f3f5" text-anchor="start" opacity="1" xml:space="preserve">easy</text><text x="1468.00" y="755.00" font-family="Liberation Sans" font-size="30" font-weight="400" fill="#f1f3f5" text-anchor="start" opacity="1" xml:space="preserve">Expensive, rarely seen</text><text x="1468.00" y="791.00" font-family="Liberation Sans" font-size="30" font-weight="400" fill="#f1f3f5" text-anchor="start" opacity="1" xml:space="preserve">outside IT</text><rect x="120.00" y="832.00" width="1680.00" height="136.00" rx="0" fill="#1b2027"/><text x="138.00" y="909.60" font-family="Liberation Sans" font-size="32" font-weight="700" fill="#f1f3f5" text-anchor="start" opacity="1" xml:space="preserve">Java 1.0</text><text x="438.00" y="891.00" font-family="Liberation Sans" font-size="30" font-weight="400" fill="#f1f3f5" text-anchor="start" opacity="1" xml:space="preserve">Java, from Sun</text><text x="438.00" y="927.00" font-family="Liberation Sans" font-size="30" font-weight="400" fill="#f1f3f5" text-anchor="start" opacity="1" xml:space="preserve">Microsystems</text><text x="748.00" y="909.00" font-family="Liberation Sans" font-size="30" font-weight="400" fill="#f1f3f5" text-anchor="start" opacity="1" xml:space="preserve">AWT toolkit</text><text x="1118.00" y="891.00" font-family="Liberation Sans" font-size="30" font-weight="400" fill="#f1f3f5" text-anchor="start" opacity="1" xml:space="preserve">Write Once, Run</text><text x="1118.00" y="927.00" font-family="Liberation Sans" font-size="30" font-weight="400" fill="#f1f3f5" text-anchor="start" opacity="1" xml:space="preserve">Anywhere</text><text x="1468.00" y="891.00" font-family="Liberation Sans" font-size="30" font-weight="400" fill="#f1f3f5" text-anchor="start" opacity="1" xml:space="preserve">New, slow, few</text><text x="1468.00" y="927.00" font-family="Liberation Sans" font-size="30" font-weight="400" fill="#f1f3f5" text-anchor="start" opacity="1" xml:space="preserve">libraries</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img"><title>FORTRAN | BASIC: Same task, different syntax</title><defs><pattern id="back" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M0 6L6 0L12 6L6 12Z" fill="none" stroke="#8fa1c5" stroke-width="1"/></pattern><pattern id="felt" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M1 2h1M6 7h1" stroke="#ffffff" stroke-opacity=".035"/></pattern></defs><rect x="0.00" y="0.00" width="1920.00" height="1080.00" rx="0" fill="#111318"/><text x="120.00" y="150.00" font-family="Liberation Sans" font-size="64" font-weight="700" fill="#f1f3f5" text-anchor="start" opacity="1" xml:space="preserve">Same task, different syntax</text><rect x="120.00" y="248.00" width="820.00" height="744.00" rx="0" fill="#1b2027" stroke="#343d48" stroke-width="2"/><text x="160.00" y="326.00" font-family="Liberation Sans" font-size="56" font-weight="700" fill="#f1f3f5" text-anchor="start" opacity="1" xml:space="preserve">FORTRAN</text><text x="160.00" y="374.00" font-family="Liberation Sans" font-size="30" font-weight="400" fill="#aeb6bf" text-anchor="start" opacity="1" xml:space="preserve">FORTRAN II for the IBM 7090/7094</text><rect x="160.00" y="414.00" width="740.00" height="352.00" rx="0" fill="#151a20"/><rect x="170.00" y="476.00" width="720.00" height="57.00" rx="2" fill="#223247"/><rect x="170.00" y="541.00" width="720.00" height="57.00" rx="2" fill="#223247"/><rect x="170.00" y="606.00" width="720.00" height="57.00" rx="2" fill="#223247"/><rect x="170.00" y="671.00" width="720.00" height="57.00" rx="2" fill="#223247"/><path d="M190.00 448.00L335.00 448.00" fill="none" stroke="#aeb6bf" stroke-width="2"/><text x="190.00" y="440.00" font-family="Liberation Sans" font-size="26" font-weight="400" fill="#aeb6bf" text-anchor="start" opacity="1" xml:space="preserve">cols 1-5</text><path d="M364.00 448.00L654.00 448.00" fill="none" stroke="#aeb6bf" stroke-width="2"/><text x="364.00" y="440.00" font-family="Liberation Sans" font-size="26" font-weight="400" fill="#aeb6bf" text-anchor="start" opacity="1" xml:space="preserve">col 7 onward</text><text x="364.00" y="520.00" font-family="DejaVu Sans Mono" font-size="48" font-weight="400" fill="#79adff" text-anchor="start" opacity="1" xml:space="preserve">PRINT</text><text x="538.00" y="520.00" font-family="DejaVu Sans Mono" font-size="48" font-weight="400" fill="#f1f3f5" text-anchor="start" opacity="1" xml:space="preserve">1</text><text x="306.00" y="585.00" font-family="DejaVu Sans Mono" font-size="48" font-weight="400" fill="#f1f3f5" text-anchor="start" opacity="1" xml:space="preserve">1</text><text x="364.00" y="585.00" font-family="DejaVu Sans Mono" font-size="48" font-weight="400" fill="#79adff" text-anchor="start" opacity="1" xml:space="preserve">FORMAT</text><text x="567.00" y="585.00" font-family="DejaVu Sans Mono" font-size="48" font-weight="400" fill="#f1f3f5" text-anchor="start" opacity="1" xml:space="preserve">(6H</text><text x="683.00" y="585.00" font-family="DejaVu Sans Mono" font-size="48" font-weight="400" fill="#eab676" text-anchor="start" opacity="1" xml:space="preserve">HELLO)</text><text x="364.00" y="650.00" font-family="DejaVu Sans Mono" font-size="48" font-weight="400" fill="#79adff" text-anchor="start" opacity="1" xml:space="preserve">CALL</text><text x="509.00" y="650.00" font-family="DejaVu Sans Mono" font-size="48" font-weight="400" fill="#79adff" text-anchor="start" opacity="1" xml:space="preserve">EXIT</text><text x="364.00" y="715.00" font-family="DejaVu Sans Mono" font-size="48" font-weight="400" fill="#79adff" text-anchor="start" opacity="1" xml:space="preserve">END</text><text x="160.00" y="832.00" font-family="Liberation Sans" font-size="36" font-weight="700" fill="#eab676" text-anchor="start" opacity="1" xml:space="preserve">4 statements</text><text x="160.00" y="882.00" font-family="Liberation Sans" font-size="30" font-weight="400" fill="#f1f3f5" text-anchor="start" opacity="1" xml:space="preserve">6H counts the next six characters; the first, a blank, is</text><text x="160.00" y="921.00" font-family="Liberation Sans" font-size="30" font-weight="400" fill="#f1f3f5" text-anchor="start" opacity="1" xml:space="preserve">printer carriage control.</text><rect x="980.00" y="248.00" width="820.00" height="744.00" rx="0" fill="#1b2027" stroke="#343d48" stroke-width="2"/><text x="1020.00" y="326.00" font-family="Liberation Sans" font-size="56" font-weight="700" fill="#f1f3f5" text-anchor="start" opacity="1" xml:space="preserve">BASIC</text><text x="1020.00" y="374.00" font-family="Liberation Sans" font-size="30" font-weight="400" fill="#aeb6bf" text-anchor="start" opacity="1" xml:space="preserve">Dartmouth BASIC, October 1964</text><rect x="1020.00" y="414.00" width="740.00" height="352.00" rx="0" fill="#151a20"/><rect x="1030.00" y="476.00" width="720.00" height="57.00" rx="2" fill="#223247"/><rect x="1030.00" y="541.00" width="720.00" height="57.00" rx="2" fill="#223247"/><text x="1050.00" y="520.00" font-family="DejaVu Sans Mono" font-size="48" font-weight="400" fill="#f1f3f5" text-anchor="start" opacity="1" xml:space="preserve">10</text><text x="1137.00" y="520.00" font-family="DejaVu Sans Mono" font-size="48" font-weight="400" fill="#79adff" text-anchor="start" opacity="1" xml:space="preserve">PRINT</text><text x="1311.00" y="520.00" font-family="DejaVu Sans Mono" font-size="48" font-weight="400" fill="#eab676" text-anchor="start" opacity="1" xml:space="preserve">&quot;HELLO&quot;</text><text x="1050.00" y="585.00" font-family="DejaVu Sans Mono" font-size="48" font-weight="400" fill="#f1f3f5" text-anchor="start" opacity="1" xml:space="preserve">20</text><text x="1137.00" y="585.00" font-family="DejaVu Sans Mono" font-size="48" font-weight="400" fill="#79adff" text-anchor="start" opacity="1" xml:space="preserve">END</text><text x="1020.00" y="832.00" font-family="Liberation Sans" font-size="36" font-weight="700" fill="#eab676" text-anchor="start" opacity="1" xml:space="preserve">2 statements</text><text x="1020.00" y="882.00" font-family="Liberation Sans" font-size="30" font-weight="400" fill="#f1f3f5" text-anchor="start" opacity="1" xml:space="preserve">The message sits in quotes; END carries the highest</text><text x="1020.00" y="921.00" font-family="Liberation Sans" font-size="30" font-weight="400" fill="#f1f3f5" text-anchor="start" opacity="1" xml:space="preserve">line number.</text></svg>
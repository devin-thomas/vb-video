<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img"><title>Visual Basic for Mac: Product Not Found</title><defs><pattern id="back" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M0 6L6 0L12 6L6 12Z" fill="none" stroke="#8fa1c5" stroke-width="1"/></pattern><pattern id="felt" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M1 2h1M6 7h1" stroke="#ffffff" stroke-opacity=".035"/></pattern></defs><rect x="0.00" y="0.00" width="1920.00" height="1080.00" rx="0" fill="#111318"/><rect x="260.00" y="100.00" width="1400.00" height="880.00" rx="0" fill="#c0c0c0"/><path d="M260 980V100H1660" stroke="#ffffff" stroke-width="3" fill="none" stroke-linejoin="round"/><path d="M1660 100V980H260" stroke="#505050" stroke-width="3" fill="none" stroke-linejoin="round"/><path d="M263 977V103H1657" stroke="#dfdfdf" stroke-width="1" fill="none" stroke-linejoin="round"/><rect x="266.00" y="106.00" width="1388.00" height="54.00" rx="0" fill="#000080"/><text x="282.00" y="150.00" font-family="Liberation Sans" font-size="30" font-weight="700" fill="#ffffff" text-anchor="start" opacity="1" xml:space="preserve">Microsoft Product Library</text><rect x="1613.00" y="114.00" width="31.00" height="30.00" rx="0" fill="#c0c0c0"/><path d="M1613 144V114H1644" stroke="#ffffff" stroke-width="3" fill="none" stroke-linejoin="round"/><path d="M1644 114V144H1613" stroke="#505050" stroke-width="3" fill="none" stroke-linejoin="round"/><path d="M1616 141V117H1641" stroke="#dfdfdf" stroke-width="1" fill="none" stroke-linejoin="round"/><path d="M1621 121l15 15m-15 0l15-15" stroke="#111" stroke-width="2.4" fill="none" stroke-linejoin="round"/><circle cx="340" cy="238" r="48" fill="#000080" stroke="#4060a0" stroke-width="3"/><text x="340.00" y="256.00" font-family="Liberation Sans" font-size="56" font-weight="700" fill="#ffffff" text-anchor="middle" opacity="1" xml:space="preserve">?</text><text x="400.00" y="218.00" font-family="Liberation Sans" font-size="52" font-weight="700" fill="#111318" text-anchor="start" opacity="1" xml:space="preserve">&quot;Visual Basic for Mac&quot;</text><text x="400.00" y="262.00" font-family="Liberation Sans" font-size="36" font-weight="700" fill="#b53b34" text-anchor="start" opacity="1" xml:space="preserve">Product Not Found</text><path d="M300.00 292.00L1620.00 292.00" fill="none" stroke="#858585" stroke-width="2"/><path d="M300.00 294.00L1620.00 294.00" fill="none" stroke="#eeeeee" stroke-width="2"/><text x="320.00" y="341.00" font-family="Liberation Sans" font-size="34" font-weight="400" fill="#333333" text-anchor="start" opacity="1" xml:space="preserve">Microsoft never released a standalone product</text><text x="320.00" y="385.00" font-family="Liberation Sans" font-size="34" font-weight="400" fill="#333333" text-anchor="start" opacity="1" xml:space="preserve">called &quot;Visual Basic&quot; for the Macintosh.</text><text x="320.00" y="459.00" font-family="Liberation Sans" font-size="30" font-weight="400" fill="#555555" text-anchor="start" opacity="1" xml:space="preserve">The closest Microsoft BASIC for Macintosh:</text><rect x="320.00" y="483.00" width="1280.00" height="190.00" rx="0" fill="#f0f0f0"/><path d="M320 673V483H1600" stroke="#505050" stroke-width="3" fill="none" stroke-linejoin="round"/><path d="M1600 483V673H320" stroke="#ffffff" stroke-width="3" fill="none" stroke-linejoin="round"/><path d="M323 670V486H1597" stroke="#808080" stroke-width="1" fill="none" stroke-linejoin="round"/><text x="344.00" y="525.00" font-family="Liberation Sans" font-size="40" font-weight="700" fill="#000080" text-anchor="start" opacity="1" xml:space="preserve">Microsoft QuickBASIC 1.00</text><text x="344.00" y="563.00" font-family="Liberation Sans" font-size="36" font-weight="400" fill="#333333" text-anchor="start" opacity="1" xml:space="preserve">for Apple Macintosh</text><text x="344.00" y="601.00" font-family="Liberation Sans" font-size="27" font-weight="400" fill="#555555" text-anchor="start" opacity="1" xml:space="preserve">Released 1988  |  Last update: 1.00e (April 1992)</text><text x="344.00" y="635.00" font-family="Liberation Sans" font-size="27" font-weight="400" fill="#555555" text-anchor="start" opacity="1" xml:space="preserve">Platform: Classic Mac OS, 68K (System 4.10+)</text><text x="320.00" y="703.00" font-family="Liberation Sans" font-size="26" font-weight="400" fill="#555555" text-anchor="start" opacity="1" xml:space="preserve">Also on Mac:  BASIC Interpreter 1.0–3.0 (1984–1986)</text><text x="320.00" y="737.00" font-family="Liberation Sans" font-size="26" font-weight="400" fill="#555555" text-anchor="start" opacity="1" xml:space="preserve">  BASIC Compiler 1.0  |  VBA in Office for Mac (from ~1994)</text><text x="320.00" y="904.00" font-family="Liberation Sans" font-size="22" font-weight="400" fill="#888888" text-anchor="start" opacity="1" xml:space="preserve">Evidence: Microsoft KB, MacWEEK 1996, period sources  —  see provenance.json</text><rect x="1420.00" y="892.00" width="180.00" height="58.00" rx="0" fill="#c0c0c0"/><path d="M1420 950V892H1600" stroke="#ffffff" stroke-width="3" fill="none" stroke-linejoin="round"/><path d="M1600 892V950H1420" stroke="#505050" stroke-width="3" fill="none" stroke-linejoin="round"/><path d="M1423 947V895H1597" stroke="#dfdfdf" stroke-width="1" fill="none" stroke-linejoin="round"/><text x="1510.00" y="934.00" font-family="Liberation Sans" font-size="32" font-weight="400" fill="#111" text-anchor="middle" opacity="1" xml:space="preserve">OK</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <style>
      .bg { fill: #0D1117; }
      .title { fill: #8B949E; font-family: Consolas, 'Courier New', monospace; font-size: 22px; letter-spacing: 2px; }
      .code { font-family: Consolas, 'Courier New', monospace; font-size: 16.5px; }
      .kw { fill: #569CD6; }
      .str { fill: #CE9178; }
      .cls { fill: #4EC9B0; }
      .fn { fill: #DCDCAA; }
      .cmt { fill: #6A9955; }
      .p { fill: #D4D4D4; }
      .ann { fill: #DCDCAA; }
      .pkg { fill: #C586C0; }
      .num { fill: #B5CEA8; }
    </style>
  </defs>
  <rect class="bg" width="1920" height="1080"/>

  <!-- Title -->
  <text class="title" x="960" y="46" text-anchor="middle" opacity="0.65">JAVA 1.0 &#8212; ONE BUTTON ON SCREEN</text>
  <line x1="160" y1="64" x2="1760" y2="64" stroke="#30363D" stroke-width="1"/>

  <g class="code">

    <!-- Imports -->
    <text x="200" y="108"><tspan class="kw">import</tspan><tspan class="p"> </tspan><tspan class="pkg">java.awt.*</tspan><tspan class="p">;</tspan></text>
    <text x="200" y="136"><tspan class="kw">import</tspan><tspan class="p"> </tspan><tspan class="pkg">java.awt.event.*</tspan><tspan class="p">;</tspan></text>

    <!-- Blank -->

    <!-- Class declaration -->
    <text x="200" y="180"><tspan class="kw">public</tspan><tspan class="p"> </tspan><tspan class="kw">class</tspan><tspan class="p"> </tspan><tspan class="cls">HelloButton</tspan><tspan class="p"> </tspan><tspan class="kw">extends</tspan><tspan class="p"> </tspan><tspan class="cls">Frame</tspan><tspan class="p"> </tspan><tspan class="kw">implements</tspan><tspan class="p"> </tspan><tspan class="cls">ActionListener</tspan><tspan class="p"> {</tspan></text>

    <!-- Fields -->
    <text x="248" y="220"><tspan class="kw">private</tspan><tspan class="p"> </tspan><tspan class="cls">Button</tspan><tspan class="p"> button;</tspan></text>
    <text x="248" y="248"><tspan class="kw">private</tspan><tspan class="p"> </tspan><tspan class="cls">Label</tspan><tspan class="p">  label;</tspan></text>

    <!-- Constructor -->
    <text x="248" y="292"><tspan class="kw">public</tspan><tspan class="p"> </tspan><tspan class="fn">HelloButton</tspan><tspan class="p">() {</tspan></text>
    <text x="296" y="320"><tspan class="kw">super</tspan><tspan class="p">(</tspan><tspan class="str">"Java AWT Example"</tspan><tspan class="p">);</tspan></text>
    <text x="296" y="348"><tspan class="fn">setLayout</tspan><tspan class="p">(</tspan><tspan class="kw">new</tspan><tspan class="p"> </tspan><tspan class="cls">FlowLayout</tspan><tspan class="p">());</tspan></text>

    <!-- Blank -->

    <text x="296" y="388"><tspan class="p">button = </tspan><tspan class="kw">new</tspan><tspan class="p"> </tspan><tspan class="cls">Button</tspan><tspan class="p">(</tspan><tspan class="str">"Click Me"</tspan><tspan class="p">);</tspan></text>
    <text x="296" y="416"><tspan class="p">button.</tspan><tspan class="fn">addActionListener</tspan><tspan class="p">(</tspan><tspan class="kw">this</tspan><tspan class="p">);</tspan></text>
    <text x="296" y="444"><tspan class="fn">add</tspan><tspan class="p">(button);</tspan></text>

    <!-- Blank -->

    <text x="296" y="484"><tspan class="p">label = </tspan><tspan class="kw">new</tspan><tspan class="p"> </tspan><tspan class="cls">Label</tspan><tspan class="p">(</tspan><tspan class="str">"Hello, World!"</tspan><tspan class="p">);</tspan></text>
    <text x="296" y="512"><tspan class="fn">add</tspan><tspan class="p">(label);</tspan></text>

    <!-- Blank -->

    <text x="296" y="552"><tspan class="fn">addWindowListener</tspan><tspan class="p">(</tspan><tspan class="kw">new</tspan><tspan class="p"> </tspan><tspan class="cls">WindowAdapter</tspan><tspan class="p">() {</tspan></text>
    <text x="344" y="580"><tspan class="kw">public</tspan><tspan class="p"> </tspan><tspan class="kw">void</tspan><tspan class="p"> </tspan><tspan class="fn">windowClosing</tspan><tspan class="p">(</tspan><tspan class="cls">WindowEvent</tspan><tspan class="p"> e) {</tspan></text>
    <text x="392" y="608"><tspan class="cls">System</tspan><tspan class="p">.</tspan><tspan class="fn">exit</tspan><tspan class="p">(</tspan><tspan class="num">0</tspan><tspan class="p">);</tspan></text>
    <text x="344" y="636"><tspan class="p">}</tspan></text>
    <text x="296" y="664"><tspan class="p">});</tspan></text>

    <!-- Blank -->

    <text x="296" y="704"><tspan class="fn">setSize</tspan><tspan class="p">(</tspan><tspan class="num">300</tspan><tspan class="p">, </tspan><tspan class="num">200</tspan><tspan class="p">);</tspan></text>
    <text x="296" y="732"><tspan class="fn">setVisible</tspan><tspan class="p">(</tspan><tspan class="kw">true</tspan><tspan class="p">);</tspan></text>
    <text x="248" y="760"><tspan class="p">}</tspan></text>

    <!-- actionPerformed -->
    <text x="248" y="804"><tspan class="kw">public</tspan><tspan class="p"> </tspan><tspan class="kw">void</tspan><tspan class="p"> </tspan><tspan class="fn">actionPerformed</tspan><tspan class="p">(</tspan><tspan class="cls">ActionEvent</tspan><tspan class="p"> e) {</tspan></text>
    <text x="296" y="832"><tspan class="p">label.</tspan><tspan class="fn">setText</tspan><tspan class="p">(</tspan><tspan class="str">"Button clicked!"</tspan><tspan class="p">);</tspan></text>
    <text x="248" y="860"><tspan class="p">}</tspan></text>

    <!-- main -->
    <text x="248" y="904"><tspan class="kw">public</tspan><tspan class="p"> </tspan><tspan class="kw">static</tspan><tspan class="p"> </tspan><tspan class="kw">void</tspan><tspan class="p"> </tspan><tspan class="fn">main</tspan><tspan class="p">(</tspan><tspan class="cls">String</tspan><tspan class="p">[] args) {</tspan></text>
    <text x="296" y="932"><tspan class="kw">new</tspan><tspan class="p"> </tspan><tspan class="fn">HelloButton</tspan><tspan class="p">();</tspan></text>
    <text x="248" y="960"><tspan class="p">}</tspan></text>

    <!-- Close class -->
    <text x="200" y="988"><tspan class="p">}</tspan></text>

  </g>

  <!-- Footer -->
  <text x="960" y="1040" text-anchor="middle" fill="#484F58" font-family="Consolas, 'Courier New', monospace" font-size="14px" font-style="italic">Write Once, Run Anywhere (slowly)</text>

  <!-- Asset ID -->
  <text x="1880" y="1060" text-anchor="end" fill="#30363D" font-family="Consolas, 'Courier New', monospace" font-size="11px">XTRA-04</text>
</svg>

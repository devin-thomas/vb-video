<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img"><title>The runtime was part of the download story</title><defs><pattern id="back" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M0 6L6 0L12 6L6 12Z" fill="none" stroke="#8fa1c5" stroke-width="1"/></pattern><pattern id="felt" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M1 2h1M6 7h1" stroke="#ffffff" stroke-opacity=".035"/></pattern></defs><rect x="0.00" y="0.00" width="1920.00" height="1080.00" rx="0" fill="#111318"/><text x="130.00" y="390.00" font-family="Liberation Sans" font-size="74" font-weight="700" fill="#f1f3f5" text-anchor="start" opacity="1" xml:space="preserve">The app wasn’t the whole download.</text><text x="134.00" y="634.00" font-family="Liberation Sans" font-size="54" font-weight="400" fill="#79adff" text-anchor="start" opacity="1" xml:space="preserve">The VB runtime shipped separately.</text></svg>